name: CI

# Corre en cada push y pull request: compila el backend, corre sus pruebas automatizadas,
# y compila el frontend. Sirve como red de seguridad para no subir un cambio que rompe el
# build sin darse cuenta.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restaurar dependencias
        run: dotnet restore
        working-directory: backend
      - name: Compilar
        run: dotnet build --no-restore --configuration Release
        working-directory: backend
      - name: Ejecutar pruebas
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend
      - name: Revisar el codigo
        run: npm run lint
        working-directory: frontend
      - name: Compilar
        run: npm run build
        working-directory: frontend
