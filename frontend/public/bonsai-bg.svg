<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1338" />
      <stop offset="32%" stop-color="#6a3475" />
      <stop offset="58%" stop-color="#c9538a" />
      <stop offset="78%" stop-color="#ff8c9f" />
      <stop offset="100%" stop-color="#ffb8a6" />
    </linearGradient>
    <radialGradient id="moon" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffd9e4" />
      <stop offset="55%" stop-color="#f79bbb" />
      <stop offset="100%" stop-color="#d95b8f" />
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9ec7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ff9ec7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6a6c0" />
      <stop offset="35%" stop-color="#a44a86" />
      <stop offset="100%" stop-color="#26102f" />
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6f0" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffe6f0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffe6f0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d9c8f0" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff0f5" stop-opacity="0" />
    </linearGradient>
    <filter id="blur20" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="20" /></filter>
    <filter id="blur6" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" /></filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5" /></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.1" /></filter>

    <!-- Racimo de flores de cerezo, se reutiliza con <use> -->
    <g id="bl">
      <circle cx="0" cy="0" r="22" fill="#ff5fa8" opacity="0.95" />
      <circle cx="20" cy="-10" r="16" fill="#ff86bd" />
      <circle cx="-18" cy="-8" r="15" fill="#f0489a" />
      <circle cx="8" cy="18" r="16" fill="#ff9fca" />
      <circle cx="-10" cy="16" r="13" fill="#e83b8f" />
      <circle cx="30" cy="10" r="12" fill="#ffb1d4" />
      <circle cx="-32" cy="6" r="11" fill="#ff7db6" />
      <circle cx="4" cy="-26" r="12" fill="#ff9acb" />
      <circle cx="14" cy="28" r="7" fill="#ffc4de" />
      <circle cx="-24" cy="-22" r="8" fill="#ff6fb0" />
      <circle cx="26" cy="-24" r="7" fill="#ffb8d8" />
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="1600" height="800" fill="url(#sky)" />
  <g filter="url(#blur20)">
    <ellipse cx="900" cy="60" rx="420" ry="70" fill="#24102e" opacity="0.75" />
    <ellipse cx="1300" cy="120" rx="330" ry="60" fill="#33163c" opacity="0.7" />
    <ellipse cx="500" cy="130" rx="300" ry="50" fill="#3a1a48" opacity="0.6" />
    <ellipse cx="1500" cy="40" rx="260" ry="50" fill="#24102e" opacity="0.8" />
    <ellipse cx="1000" cy="250" rx="380" ry="40" fill="#ff9c8f" opacity="0.35" />
    <ellipse cx="1350" cy="310" rx="300" ry="30" fill="#ffb0a0" opacity="0.35" />
    <ellipse cx="700" cy="270" rx="260" ry="30" fill="#f7809f" opacity="0.3" />
  </g>

  <!-- Luna -->
  <circle cx="1130" cy="440" r="380" fill="url(#moonGlow)" />
  <circle cx="1130" cy="440" r="235" fill="url(#moon)" />
  <g opacity="0.22" fill="#fff0f5">
    <ellipse cx="1060" cy="380" rx="70" ry="40" />
    <ellipse cx="1190" cy="470" rx="60" ry="34" />
    <ellipse cx="1120" cy="540" rx="80" ry="30" />
  </g>

  <!-- Montanas lejanas -->
  <path d="M0,420 L90,380 L170,400 L260,340 L330,380 L420,330 L500,370 L600,300 L690,350 L780,310 L860,360 L960,320 L1040,370 L1130,330 L1220,380 L1320,340 L1420,390 L1520,350 L1600,380 L1600,640 L0,640 Z" fill="#8b5a9a" opacity="0.55" />
  <rect x="0" y="380" width="1600" height="90" fill="url(#mist)" />

  <!-- Montanas medias -->
  <path d="M180,560 L230,420 L260,440 L300,330 L340,300 L370,340 L400,290 L440,360 L470,420 L520,400 L560,300 L600,210 L640,160 L680,120 L720,150 L750,210 L790,260 L820,330 L860,290 L900,220 L940,240 L980,320 L1030,300 L1060,360 L1100,420 L1150,470 L1150,600 L180,600 Z" fill="#4b2a5c" opacity="0.96" />
  <rect x="150" y="430" width="1100" height="80" fill="url(#mist)" opacity="0.8" />

  <!-- Cascadas en las montanas -->
  <g filter="url(#blur2)">
    <path d="M680,240 L676,320 L690,400" stroke="url(#foam)" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M900,290 L896,370 L906,430" stroke="url(#foam)" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M560,380 L556,440 L566,490" stroke="url(#foam)" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M1010,380 L1008,440 L1016,500" stroke="url(#foam)" stroke-width="5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Montanas cercanas -->
  <path d="M100,620 L140,520 L200,490 L240,450 L300,480 L350,440 L400,490 L450,460 L520,520 L580,490 L640,450 L700,490 L760,460 L820,500 L880,470 L960,520 L1040,490 L1100,540 L1180,520 L1260,560 L1260,650 L100,650 Z" fill="#2f1a3c" />

  <!-- Acantilado derecho con pagoda -->
  <path d="M1220,660 L1240,540 L1290,490 L1340,470 L1420,462 L1480,480 L1520,510 L1560,520 L1600,510 L1600,670 Z" fill="#1a0e22" />
  <g fill="#120818">
    <rect x="1462" y="446" width="28" height="16" />
    <path d="M1450,446 L1476,428 L1502,446 Z" />
    <path d="M1458,432 L1476,418 L1494,432 Z" />
    <rect x="1474" y="404" width="4" height="14" />
  </g>

  <!-- Islote central con cerezo pequeno -->
  <path d="M640,520 L690,470 L760,465 L810,510 L820,560 L640,560 Z" fill="#1c0f24" />
  <path d="M735,470 C740,455 748,445 760,435" stroke="#150a1c" stroke-width="5" fill="none" stroke-linecap="round" />
  <use href="#bl" transform="translate(755,432) scale(0.9)" />
  <use href="#bl" transform="translate(720,455) scale(0.55)" />

  <!-- Neblina del horizonte -->
  <rect x="0" y="560" width="1600" height="110" fill="url(#mist)" />

  <!-- Agua -->
  <rect x="0" y="650" width="1600" height="150" fill="url(#water)" />
  <rect x="1372" y="655" width="36" height="145" fill="url(#glint)" opacity="0.8" />
  <g stroke="#ffe9f2" stroke-width="2" opacity="0.28" stroke-linecap="round">
    <line x1="1200" y1="675" x2="1560" y2="675" />
    <line x1="1150" y1="705" x2="1600" y2="705" />
    <line x1="1000" y1="735" x2="1500" y2="735" />
    <line x1="900" y1="765" x2="1400" y2="765" />
  </g>

  <!-- Cascadas escalonadas del primer plano -->
  <path d="M0,540 L60,500 L140,510 L220,470 L300,520 L380,560 L470,590 L560,640 L680,672 L780,700 L780,800 L0,800 Z" fill="#150a1c" />
  <!-- Chorros de agua cayendo por la roca, con salpicadura en la base -->
  <g filter="url(#blur2)">
    <path d="M118,500 L142,500 L150,612 L108,612 Z" fill="url(#foam)" />
    <path d="M232,570 L252,570 L260,660 L224,660 Z" fill="url(#foam)" />
    <path d="M334,596 L354,596 L360,668 L326,668 Z" fill="url(#foam)" />
    <path d="M452,626 L474,626 L482,694 L444,694 Z" fill="url(#foam)" />
    <path d="M566,650 L590,650 L598,722 L556,722 Z" fill="url(#foam)" />
    <path d="M676,676 L698,676 L706,738 L668,738 Z" fill="url(#foam)" />
    <g fill="#ffffff" opacity="0.6">
      <ellipse cx="128" cy="614" rx="32" ry="6" />
      <ellipse cx="242" cy="662" rx="26" ry="5" />
      <ellipse cx="342" cy="670" rx="26" ry="5" />
      <ellipse cx="462" cy="696" rx="28" ry="6" />
      <ellipse cx="578" cy="724" rx="32" ry="6" />
      <ellipse cx="686" cy="740" rx="30" ry="6" />
    </g>
  </g>

  <!-- Roca en la esquina inferior izquierda -->
  <path d="M0,720 L90,700 L180,730 L260,760 L300,800 L0,800 Z" fill="#0f0615" />

  <!-- Cerezo grande, arriba a la izquierda -->
  <g stroke="#150a1c" fill="none" stroke-linecap="round">
    <path d="M0,340 C70,290 120,230 170,150" stroke-width="38" />
    <path d="M0,430 C40,390 80,360 125,335" stroke-width="26" />
    <path d="M170,150 C230,120 300,110 380,80" stroke-width="16" />
    <path d="M170,150 C210,90 260,60 330,20" stroke-width="12" />
    <path d="M120,225 C200,245 280,235 360,205" stroke-width="10" />
    <path d="M250,115 C300,165 340,175 400,150" stroke-width="7" />
    <path d="M60,270 C110,300 170,300 230,290" stroke-width="8" />
  </g>
  <g filter="url(#soft)">
    <use href="#bl" transform="translate(135,105) scale(1.5)" />
    <use href="#bl" transform="translate(215,68) scale(1.4)" />
    <use href="#bl" transform="translate(300,55) scale(1.5)" />
    <use href="#bl" transform="translate(375,48) scale(1.3)" />
    <use href="#bl" transform="translate(420,95) scale(1.2)" />
    <use href="#bl" transform="translate(335,132) scale(1.4)" />
    <use href="#bl" transform="translate(262,172) scale(1.3)" />
    <use href="#bl" transform="translate(180,205) scale(1.4)" />
    <use href="#bl" transform="translate(365,192) scale(1.1)" />
    <use href="#bl" transform="translate(445,140) scale(1.0)" />
    <use href="#bl" transform="translate(85,170) scale(1.3)" />
    <use href="#bl" transform="translate(50,90) scale(1.5)" />
    <use href="#bl" transform="translate(480,62) scale(0.9)" />
    <use href="#bl" transform="translate(305,15) scale(1.2)" />
    <use href="#bl" transform="translate(150,28) scale(1.3)" />
    <use href="#bl" transform="translate(95,262) scale(1.2)" />
    <use href="#bl" transform="translate(250,232) scale(1.0)" />
    <use href="#bl" transform="translate(30,190) scale(1.2)" />
    <use href="#bl" transform="translate(228,290) scale(0.9)" />
  </g>

  <!-- Petalos cayendo -->
  <g fill="#ffb3d4">
    <ellipse cx="540" cy="220" rx="9" ry="5" transform="rotate(35 540 220)" opacity="0.85" />
    <ellipse cx="620" cy="330" rx="7" ry="4" transform="rotate(-20 620 330)" opacity="0.7" />
    <ellipse cx="470" cy="420" rx="8" ry="4.5" transform="rotate(60 470 420)" opacity="0.8" />
    <ellipse cx="380" cy="310" rx="7" ry="4" transform="rotate(10 380 310)" opacity="0.75" />
    <ellipse cx="880" cy="140" rx="8" ry="4.5" transform="rotate(-40 880 140)" opacity="0.8" />
    <ellipse cx="1480" cy="150" rx="8" ry="4.5" transform="rotate(25 1480 150)" opacity="0.8" />
    <ellipse cx="60" cy="600" rx="12" ry="7" transform="rotate(30 60 600)" opacity="0.9" />
    <ellipse cx="150" cy="760" rx="16" ry="9" transform="rotate(-25 150 760)" opacity="0.85" filter="url(#blur6)" />
    <ellipse cx="420" cy="600" rx="8" ry="4.5" transform="rotate(50 420 600)" opacity="0.7" />
  </g>
</svg>
